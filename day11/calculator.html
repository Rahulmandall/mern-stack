<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="calculator.css" />
</head>
<body>
  <div class="calculator" role="widget" aria-label="Simple calculator layout "><div class="screen" aria-live="polite" aria-atomic="true">
      <div class="expression" aria-hidden="true"></div>

    <div class="display" aria-hidden="true">1+1=11</div>

    <div class="keys">
      <button class="btn clear" aria-label="clear">C</button>
      <button class="btn operator" aria-label="divide">÷</button>
      <button class="btn operator" aria-label="multiply">×</button>
      <button class="btn operator" aria-label="subtract">-</button>

      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn operator" aria-label="add">+</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn equal" aria-label="equals">=</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>

      <button class=" zero" aria-label="zero">0</button>
      <button class="btn" aria-label="decimal point">.</button>
    </div>
  </div>
</body>
</html>
