<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<h2>Largest of Two Numbers</h2>

<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">

<button onclick="checkLargest()">Check</button>

<p id="result"></p>

<script>
function checkLargest() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);

    if (num1 > num2) {
        document.getElementById("result").innerHTML = num1 + " is larger";
    } else if (num2 > num1) {
        document.getElementById("result").innerHTML = num2 + " is larger";
    } else {
        document.getElementById("result").innerHTML = "Both are equal";
    }
}
</script>

</body>
</html>
