<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Page</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Categories</h2>

        <ul>
            <li><a>onion</a></li>
            <li><a >Chickpea </a></li>
            <li><a >Cruciferous </a></li>
            <li><a >Dried Beans </a></li>
            <li><a >Edible Plant Stem </a></li>
            <li><a >Fresh Beans </a></li>
            <li><a >Green Vegetables </a></li>
            <li><a >Leafy Green </a></li>
            <li><a >Marrow </a></li>
            <li><a >Red Foods </a></li>
            <li><a >Uncategorized </a></li>
        </ul>

    </aside>

    <!-- Products -->
    <section class="products">

        <div class="top-bar">

            <div class="left">


            </div>

            <div class="right">

                <label>Sort By :</label>

                <select>
                    <option>default items</option>
                    <option>price very low to very high</option>
                    <option>price very high to very low</option>
                </select>

            </div>

        </div>

        <div class="product-grid">

            <div class="card">
                <img src="http://wp.plazathemes.com/safira/wp-content/uploads/2020/04/9.jpg" alt="">
                <h3>Lauka</h3>
                <p>Green Vegetables</p>
                <h4>RS 60/kg</h4>
            </div>

            <div class="card">
                <img src="http://wp.plazathemes.com/safira/wp-content/uploads/2020/04/18.jpg" alt="">
                <h3>Bread Local</h3>
                <p>Bakery Item</p>
                <h4>RS 50/kg</h4>
            </div>

            <div class="card">
                <img src="http://wp.plazathemes.com/safira/wp-content/uploads/2020/04/4.jpg" alt="">
                <h3>Tomato</h3>
                <p>Golbedha</p>
                <h4>RS 60/kg</h4>
            </div>

        </div>

    </section>

</div>

</html>
